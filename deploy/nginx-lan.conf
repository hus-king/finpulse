# This server NIC uses a routable campus address. Restrict the initial site
# to the directly-connected subnet, confirmed campus clients and SSH loopback.
server {
    listen 127.0.0.1:8000;
    listen 202.114.212.116:8000;
    server_name localhost 127.0.0.1 202.114.212.116;

    allow 127.0.0.1;
    allow 202.114.212.0/25;
    # Campus routing crosses subnets; these source addresses were observed
    # in blocked website requests. Do not infer a larger subnet from an IP.
    allow 10.17.214.75;
    allow 10.14.152.145;
    deny all;

    root /home/airhust/finpulse-deploy/current/dist;
    index index.html;
    client_max_body_size 128k;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
