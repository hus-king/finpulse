name: Android APK
on:
  push:
    branches: ['codex/android-apk-release']
    tags: ['android-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: WebView smoke test (Android 15)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w cn.finpulse.app.test/cn.finpulse.app.SmokeTest | tee smoke-result.txt
            grep -q FINPULSE_SMOKE_PASS smoke-result.txt
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification
          path: |
            android/app/build/reports/
            smoke-result.txt
  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FINPULSE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/finpulse-release.jks"
      - name: Build signed release
        working-directory: android
        env:
          FINPULSE_KEYSTORE: ${{ runner.temp }}/finpulse-release.jks
          FINPULSE_STORE_PASSWORD: ${{ secrets.FINPULSE_STORE_PASSWORD }}
          FINPULSE_KEY_ALIAS: finpulse
          FINPULSE_KEY_PASSWORD: ${{ secrets.FINPULSE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify and publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/FinPulse-${GITHUB_REF_NAME#android-}.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/*.apk
          cd release
          sha256sum *.apk > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./*.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "FinPulse Android ${GITHUB_REF_NAME#android-}" --notes-file ../docs/android-release-notes.md
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/finpulse-release.jks"
